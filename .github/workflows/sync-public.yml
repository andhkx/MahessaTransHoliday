name: Sync main → public (Cloudflare Pages)

# This workflow mirrors every push on `main` to a `public` branch that is
# safe to build with `output: "export"` on Cloudflare Pages.
#
# On `public`:
#   - app/admin/** is renamed to app/_admin_disabled/ (Next.js skips `_`-prefixed folders)
#   - middleware.ts is removed (static export cannot run middleware)
#
# Triggers:
#   - Every push to `main`
#   - Manual dispatch (workflow_dispatch)
#
# Required GitHub setup:
#   - Settings → Actions → General → Workflow permissions: "Read and write permissions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history, unshallow)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure public branch exists (bootstrap from main)
        run: |
          if git ls-remote --heads origin public | grep -q public; then
            echo "public branch exists, will be force-updated"
          else
            echo "public branch missing — creating from main"
            git checkout -b public
            git push origin public
            git checkout main
          fi

      - name: Force-sync public branch to current main
        run: |
          git checkout public
          git reset --hard origin/main
          git clean -fdx

      - name: Transform repo for static export
        run: bash scripts/sync-public.sh

      - name: Commit transformation (only if there are changes)
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "chore(sync): transform main → public for Cloudflare Pages [skip ci]"
            git push origin public --force-with-lease
            echo "✓ Pushed public branch"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Sync main → public" >> $GITHUB_STEP_SUMMARY
          echo "- Source: \`main\` @ ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cloudflare Pages should auto-detect the push and rebuild." >> $GITHUB_STEP_SUMMARY
